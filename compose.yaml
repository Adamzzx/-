name: exchange-guide
services:
  db:
    image: postgres:17-alpine
    env_file: .env.docker
    environment:
      POSTGRES_DB: exchange_dev
      POSTGRES_USER: postgres
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d exchange_dev']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  postgres-data:
